[package]
name = "rusty-smart-stitch"
version = "1.0.7"
edition = "2021"
build = "build.rs"

[profile.release]
opt-level = 2
lto = "fat"
debug = false
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
winres = "0.1.12"

[dependencies]
image = "0.25.5"
eframe = "0.29.1"
native-dialog = "0.7.0"
anyhow = "1.0.93"
egui = "0.29.1"
egui_extras = "0.29.1"
psd = "0.3.5"
tempfile = "3.14.0"
walkdir = "2.5.0"
rayon = "1.10.0"
webbrowser = "1.0.2"
open = "5.3.1"
octocrab = "0.42.1"
tokio = { version = "1.41.1", features = ["full"] }
semver = "1.0.23"
self_update = "0.41.0"
reqwest = { version = "0.12.9", features = ["json", "stream"] }
once_cell = "1.20.2"
serde = { version = "1.0", features = ["derive"] }
futures-util = { version = "0.3.31", features = ["std"] }
tokio-stream = "0.1.16"
either = "1.13.0"
rand = "0.8.5"
rfd = "0.15.1"
dirs = "5.0.0"
serde_json = "1.0.133"
mozjpeg = "0.10.12"
webp = "0.3.0"
sys-info = "0.9.1"
chrono = "0.4.40"

[lib]
name = "rusty_smart_stitch"
path = "src/lib.rs"


[[bin]]
name = "rusty-smart-stitch"
path = "src/main.rs"


[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winbase"] }