name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    
    - name: Build
      uses: actions-rs/cargo@v1
      with:
        command: build
        args: --release
    
    - name: Run tests
      uses: actions-rs/cargo@v1
      with:
        command: test
    
    - name: Check formatting
      uses: actions-rs/cargo@v1
      with:
        command: fmt
        args: -- --check
      continue-on-error: true
    
    - name: Run clippy
      uses: actions-rs/cargo@v1
      with:
        command: clippy
        args: -- -D warnings
      continue-on-error: true
  
  release:
    name: Create Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    
    - name: Build Release
      uses: actions-rs/cargo@v1
      with:
        command: build
        args: --release
    
    - name: Create Release Archive
      run: |
        mkdir release
        copy target\release\rusty-smart-stitch.exe release\
        Compress-Archive -Path release\* -DestinationPath rusty-smart-stitch-${{ github.ref_name }}.zip
      shell: pwsh
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: rusty-smart-stitch-${{ github.ref_name }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}